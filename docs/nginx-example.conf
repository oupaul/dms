# ============================================================================
# DMS（資料夾權限管理系統）— 前端 nginx 反向代理範例
# ============================================================================
# nginx 與應用程式在不同主機：
#   - 應用程式主機：設定環境變數 PROXY_ALLOWLIST=<本 nginx 主機 IP>，
#     並以防火牆只允許該 IP 連到應用程式埠（deploy.sh 會提示）
#   - nginx 主機（本檔）：終止 TLS、限速、轉送到應用程式
#
# 把 <APP_HOST_IP>、<APP_PORT>、dms.example.com 與憑證路徑換成實際值。
# 放在 /etc/nginx/conf.d/dms.conf，修改後：nginx -t && systemctl reload nginx
# ============================================================================

# 每個來源 IP 的請求頻率；登入端點另外收緊（應用程式內另有失敗次數鎖定）
limit_req_zone $binary_remote_addr zone=dms_general:10m rate=20r/s;
# 登入／邀請端點：每 IP 每分鐘 30 次、突發 10 次。公司出口共用同一個 IP 時請視人數調高；
# 暴力破解的防護主要由應用程式的失敗鎖定負責，這裡只擋洪水式請求。
limit_req_zone $binary_remote_addr zone=dms_login:10m   rate=30r/m;

upstream dms_app {
    server <APP_HOST_IP>:<APP_PORT>;
    keepalive 16;
}

# HTTP 一律轉 HTTPS
server {
    listen 80;
    server_name dms.example.com;
    return 301 https://$host$request_uri;
}

server {
    # Ubuntu 22.04/24.04 的 nginx（1.18/1.24）要寫在 listen 上；nginx >= 1.25.1 可改成
    #   listen 443 ssl;  http2 on;   （舊寫法仍可用，只會有棄用警告）
    listen 443 ssl http2;
    server_name dms.example.com;

    ssl_certificate     /etc/ssl/certs/dms.example.com.crt;
    ssl_certificate_key /etc/ssl/private/dms.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;

    # 匯入檔上限需與應用程式一致（應用程式限制單檔 10MB）
    client_max_body_size 12m;

    # 安全標頭（應用程式也會送；這裡確保 nginx 自己產生的錯誤頁也有）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # 登入端點：嚴格限速
    location = /api/auth/login {
        limit_req zone=dms_login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/dms-proxy.conf;
    }

    # 邀請註冊端點：限速
    location /api/invite/ {
        limit_req zone=dms_login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/dms-proxy.conf;
    }

    location / {
        limit_req zone=dms_general burst=60 nodelay;
        include /etc/nginx/snippets/dms-proxy.conf;
    }
}

# ----------------------------------------------------------------------------
# /etc/nginx/snippets/dms-proxy.conf（另存成獨立檔案，上面的 include 會引用）
# ----------------------------------------------------------------------------
#   proxy_pass http://dms_app;
#   proxy_http_version 1.1;
#   proxy_set_header Connection "";
#
#   # 以下三項非常重要：
#   #  - Host：應用程式的 Origin 檢查（CSRF 防護）會比對 Host / X-Forwarded-Host
#   #  - X-Forwarded-For：登入限速依此取得真實用戶端 IP
#   #  - X-Forwarded-Proto：Cookie 設為 Secure，應用程式必須知道前端是 HTTPS
#   # Host 用 $http_host（保留用戶端送來的原樣，含非標準埠）。若改用 $host，nginx 會丟掉埠號，
#   # 一旦對外網址不是 80/443（例如 https://host:8443），Origin 就對不上而全面 403。
#   proxy_set_header Host              $http_host;
#   proxy_set_header X-Real-IP         $remote_addr;
#   proxy_set_header X-Forwarded-For   $remote_addr;   # 直接覆寫，不要沿用用戶端自帶的值
#   proxy_set_header X-Forwarded-Proto $scheme;
#
#   proxy_read_timeout 120s;
#   proxy_redirect off;
