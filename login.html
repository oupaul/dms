<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - 資料夾權限文管系統</title>
    <link rel="icon" href="https://www.megapower.asia/ds/logo/logo-mark-light.png">
    <!-- Bootstrap CSS -->
    <link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons（自託管，避免外部 CDN 供應鏈風險） -->
    <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.css">
    <!-- Preload Bootstrap Icons Font -->
    <link rel="preload" href="/vendor/bootstrap-icons/fonts/bootstrap-icons.woff2" as="font" type="font/woff2" crossorigin>
    <!-- jQuery -->
    <script src="/vendor/jquery/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background: var(--color-bg-soft, #F8FAFC);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .login-header {
            background: linear-gradient(135deg, var(--color-primary, #F06000) 0%, var(--color-primary-hover, #D45200) 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .login-header h2 {
            margin: 0;
            font-weight: 600;
        }
        .login-header .brand-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 4px;
        }
        .login-header .brand-logo {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
        }
        .login-body {
            padding: 40px;
        }
        .form-control:focus {
            border-color: var(--color-primary, #F06000);
            box-shadow: 0 0 0 0.2rem rgba(240, 96, 0, 0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, var(--color-primary, #F06000) 0%, var(--color-primary-hover, #D45200) 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(240, 96, 0, 0.4);
        }
        .btn-register {
            background: linear-gradient(135deg, var(--color-primary, #F06000) 0%, var(--color-primary-hover, #D45200) 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 82, 0, 0.4);
        }
        .alert-custom {
            border: none;
            border-radius: 10px;
        }
        .input-group-text {
            background: #f8f9fa;
            border-right: none;
        }
        .form-control {
            border-left: none;
        }
        .tab-content {
            margin-top: 20px;
        }
        .nav-tabs {
            border-bottom: 2px solid #e9ecef;
        }
        .nav-tabs .nav-link {
            border: none;
            color: #6c757d;
            font-weight: 500;
            padding: 10px 20px;
        }
        .nav-tabs .nav-link.active {
            color: var(--color-primary, #F06000);
            border-bottom: 3px solid var(--color-primary, #F06000);
            background: none;
        }
        .first-account-notice {
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            color: #2d3436;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
        }
        /* 微軟官方「淺色按鈕」樣式（白底 + 邊框 + 深色文字，保留原生四色方塊圖示不改色）：
           比原本的純藍底更貼近整體白底、橘色強調的品牌風格，也是微軟自家認可的按鈕樣式之一。
           選擇器用 .btn.btn-microsoft（雙 class）拉高優先度，避免被 megapower.css 自己的
           .btn{ border:2px solid transparent } 基礎重置蓋掉（該檔案在此行內 <style> 之後才載入，
           單一 class 選擇器的話會因為載入順序在後而覆蓋掉這裡的邊框設定）。 */
        .btn.btn-microsoft {
            background: #fff;
            border: 1px solid var(--color-border, #E2E8F0);
            padding: 12px;
            font-weight: 600;
            transition: all 0.2s;
            color: var(--color-text, #1E293B);
        }
        .btn.btn-microsoft:hover {
            background: var(--color-bg-soft, #F8FAFC);
            border-color: var(--color-text-muted, #64748B);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            color: var(--color-text, #1E293B);
        }
        .sso-divider {
            display: flex;
            align-items: center;
            margin: 16px 0;
            color: #adb5bd;
            font-size: 13px;
        }
        .sso-divider::before, .sso-divider::after {
            content: '';
            flex: 1;
            border-top: 1px solid #dee2e6;
        }
        .sso-divider span { margin: 0 10px; }
    </style>
    <!-- Megapower Design System：https://github.com/Megapower-Asia-LLC/design-system -->
    <link rel="stylesheet" href="https://www.megapower.asia/ds/megapower.css">
    <link rel="stylesheet" href="megapower-theme.css">
    <link rel="stylesheet" href="/css/dms-theme.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="brand-row">
                <img src="https://www.megapower.asia/ds/logo/logo-mark-light.png" alt="群兆資訊" class="brand-logo">
                <h2>資料夾權限文管系統</h2>
            </div>
            <p class="mb-0">請登入或註冊以繼續</p>
        </div>
        
        <div class="login-body">
            <!-- 帳號建立提示 -->
            <div class="alert alert-info alert-custom" role="alert">
                <i class="bi bi-info-circle-fill"></i>
                <strong>提示：</strong>帳號需透過邀請連結建立，請向管理員索取邀請連結
            </div>

            <!-- 訊息區域 -->
            <div id="message-area"></div>

            <!-- 登入表單（預設顯示） -->
            <div id="login-section">
                <!-- M365 SSO 按鈕（檢查後動態顯示） -->
                <div id="sso-section" style="display:none;">
                    <a href="/auth/microsoft" class="btn btn-microsoft w-100">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 23 23" style="margin-right:8px;vertical-align:-3px;">
                            <rect x="0" y="0" width="11" height="11" fill="#f25022"/>
                            <rect x="12" y="0" width="11" height="11" fill="#7fba00"/>
                            <rect x="0" y="12" width="11" height="11" fill="#00a4ef"/>
                            <rect x="12" y="12" width="11" height="11" fill="#ffb900"/>
                        </svg>
                        使用 Microsoft 帳號登入
                    </a>
                    <div class="sso-divider"><span>或使用帳號密碼</span></div>
                </div>

                <form id="login-form">
                    <div class="mb-3">
                        <label class="form-label">使用者名稱</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" name="username" placeholder="請輸入使用者名稱" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密碼</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" name="password" placeholder="請輸入密碼" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-login w-100">
                        <i class="bi bi-box-arrow-in-right"></i> 登入
                    </button>
                </form>
            </div>

            <!-- 邀請建立帳號表單（偵測到 token 時顯示） -->
            <div id="invite-section" style="display:none;">
                <div id="invite-info" class="alert alert-info mb-3" style="display:none;"></div>
                <form id="invite-form">
                    <div class="mb-3">
                        <label class="form-label">姓名（選填）</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                            <input type="text" class="form-control" name="full_name" placeholder="請輸入您的姓名">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">使用者名稱 <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" name="username" placeholder="僅限英數字和底線" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密碼 <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" name="password" placeholder="至少 10 個字元，含大小寫、數字、符號三類" required minlength="10">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">確認密碼 <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" name="password_confirm" placeholder="請再次輸入密碼" required minlength="10">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success w-100">
                        <i class="bi bi-person-plus"></i> 建立帳號
                    </button>
                    <div class="mt-2 text-center">
                        <small class="text-muted"><a href="/login.html" class="text-muted">已有帳號？返回登入</a></small>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let inviteToken = null;

        const SSO_ERROR_MESSAGES = {
            ms_auth_cancelled: 'Microsoft 登入已取消。',
            ms_auth_failed: 'Microsoft 登入失敗，請再試一次。',
            ms_no_email: '無法取得 Microsoft 帳號的 Email，請聯繫管理員。',
            ms_no_linked_account: '此 Microsoft 帳號尚未綁定 DMS 帳號，請聯繫管理員設定。',
            ms_no_database: '帳號尚未指派可存取的資料庫，請聯繫管理員。',
            sso_disabled: 'SSO 功能目前未啟用。',
            sso_error: 'SSO 服務暫時無法使用，請改用帳號密碼登入。',
        };

        $(document).ready(function() {
            // 顯示 SSO 錯誤訊息
            const params = new URLSearchParams(window.location.search);
            const ssoError = params.get('error');
            if (ssoError && SSO_ERROR_MESSAGES[ssoError]) {
                showMessage('danger', SSO_ERROR_MESSAGES[ssoError]);
                history.replaceState(null, '', '/login.html');
            }

            // 檢查 SSO 是否啟用，若是則顯示 Microsoft 按鈕
            $.get('/api/auth/sso-status', function(data) {
                if (data.enabled) {
                    $('#sso-section').show();
                }
            });

            // 偵測邀請 token
            const token = params.get('token');
            if (token) {
                inviteToken = token;
                validateInviteToken(token);
            }

            // 登入表單提交
            $('#login-form').on('submit', function(e) {
                e.preventDefault();
                const formData = {
                    username: $(this).find('input[name="username"]').val(),
                    password: $(this).find('input[name="password"]').val()
                };
                $.ajax({
                    url: '/api/auth/login',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(formData),
                    success: function(response) {
                        showMessage('success', '登入成功！正在跳轉...');
                        setTimeout(function() { window.location.href = '/index.html'; }, 800);
                    },
                    error: function(xhr) {
                        const error = xhr.responseJSON?.error || '登入失敗，請重試';
                        showMessage('danger', error);
                    }
                });
            });

            // 邀請建立帳號表單提交
            $('#invite-form').on('submit', function(e) {
                e.preventDefault();
                const password = $(this).find('input[name="password"]').val();
                const confirm = $(this).find('input[name="password_confirm"]').val();
                if (password !== confirm) { showMessage('danger', '兩次輸入的密碼不一致'); return; }
                $.ajax({
                    url: `/api/invite/${inviteToken}/register`,
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        username: $(this).find('input[name="username"]').val(),
                        password: password,
                        full_name: $(this).find('input[name="full_name"]').val()
                    }),
                    success: function(response) {
                        showMessage('success', '帳號建立成功！請使用您的帳號登入。');
                        setTimeout(function() { window.location.href = '/login.html'; }, 2000);
                    },
                    error: function(xhr) {
                        showMessage('danger', xhr.responseJSON?.error || '建立帳號失敗，請重試');
                    }
                });
            });
        });

        function validateInviteToken(token) {
            $.ajax({
                url: `/api/invite/${token}`,
                method: 'GET',
                success: function(data) {
                    $('#login-section').hide();
                    $('#invite-section').show();
                    const roleLabel = data.role_level === 'db_admin' ? '客戶負責人' : '一般帳號';
                    const permLabel = data.permission_level === 'viewer' ? '唯讀' : '可編輯';
                    const dbList = (data.allowed_databases || []).join('、') || '—';
                    const expiry = new Date(data.expires_at).toLocaleString('zh-TW');
                    let infoHtml = `<strong>您已收到邀請</strong>`;
                    if (data.note) infoHtml += `<br>備注：${data.note}`;
                    infoHtml += `<br><small>角色：${roleLabel}｜權限：${permLabel}｜到期：${expiry}</small>`;
                    $('#invite-info').html(infoHtml).show();
                    // 提示欄也更新
                    $('.alert-info strong').text('受邀建立帳號');
                },
                error: function(xhr) {
                    const msg = xhr.responseJSON?.error || '邀請連結無效';
                    showMessage('danger', msg);
                }
            });
        }

        function showMessage(type, message) {
            $('#message-area').html(`
                <div class="alert alert-${type} alert-custom alert-dismissible fade show" role="alert">
                    <i class="bi bi-${type === 'success' ? 'check-circle-fill' : 'exclamation-triangle-fill'}"></i>
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `);
            setTimeout(function() { $('.alert').alert('close'); }, 6000);
        }
    </script>
</body>
</html>
